<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tweakloop</title>
<link rel="stylesheet" href="/app/shell.css">
</head>
<body>
<header>
  <h1>tweakloop</h1>
  <span id="connection" class="badge badge-wait">connecting…</span>
</header>

<section id="workspace" class="workspace"></section>

<main>
  <section class="panel">
    <h2>Artifacts</h2>
    <table id="artifacts" hidden>
      <thead><tr><th>Name</th><th>Format</th><th>Artifact ID</th><th>Source</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="artifacts-empty" class="empty">
      No artifacts yet. Register one with <code>tweak open &lt;path&gt;</code>.
    </p>
  </section>

  <section class="panel">
    <h2>Timeline</h2>
    <ol id="timeline" class="timeline"></ol>
    <p id="timeline-empty" class="empty">No events yet.</p>
  </section>
</main>

<script src="/app/shell.js"></script>
</body>
</html>
